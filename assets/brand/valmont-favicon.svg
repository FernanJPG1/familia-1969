<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGoldL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="favGoldD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Rounded Squircle Container -->
  <rect width="64" height="64" rx="16" fill="#0A0E1A"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- High-contrast V Razor Monogram -->
  <polygon points="32,52 14,14 24,14 32,36" fill="url(#favGoldL)"/>
  <polygon points="32,52 32,36 24,14 32,14" fill="url(#favGoldD)" opacity="0.6"/>
  
  <polygon points="32,52 32,36 40,14 32,14" fill="url(#favGoldL)" opacity="0.8"/>
  <polygon points="32,52 50,14 40,14 32,36" fill="url(#favGoldD)"/>
  
  <!-- Center Star/Diamond -->
  <path d="M32,7 L33.5,10.5 L37,12 L33.5,13.5 L32,17 L30.5,13.5 L27,12 L30.5,10.5 Z" fill="#FFFBEB"/>
  <!-- Pivot pin -->
  <circle cx="32" cy="52" r="2.5" fill="#0A0E1A" stroke="#FDE68A" stroke-width="1"/>
</svg>
