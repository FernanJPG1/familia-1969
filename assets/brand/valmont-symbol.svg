<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="valmontGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="valmontGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="60%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="valmontBladeShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#E2E8F0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="valmontGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Geometric Shield Boundary -->
  <polygon points="256,36 448,128 448,320 256,464 64,320 64,128" fill="none" stroke="#D4AF37" stroke-width="3" stroke-opacity="0.28" stroke-dasharray="8 4"/>

  <!-- Inner Hairline Border -->
  <polygon points="256,54 430,136 430,310 256,442 82,310 82,136" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Main Faceted V Monogram -->
  <g id="brand-monogram" filter="url(#valmontGlow)">
    <!-- Left Wing Outer Highlight -->
    <polygon points="256,410 110,120 184,120 256,296" fill="url(#valmontGoldLight)"/>
    <!-- Left Wing Inner Crease -->
    <polygon points="256,410 256,296 184,120 256,120" fill="url(#valmontGoldDark)" opacity="0.65"/>
    
    <!-- Right Wing Inner Crease -->
    <polygon points="256,410 256,296 328,120 256,120" fill="url(#valmontGoldLight)" opacity="0.8"/>
    <!-- Right Wing Outer Shadow -->
    <polygon points="256,410 402,120 328,120 256,296" fill="url(#valmontGoldDark)"/>
    
    <!-- Barber Straight Razor Spine (Center Blade) -->
    <path d="M250,72 L262,72 L260,236 L252,236 Z" fill="url(#valmontBladeShine)"/>
    
    <!-- Precision Compass Diamond (Master Barber Emblem) -->
    <path d="M256,44 L264,64 L284,72 L264,80 L256,100 L248,80 L228,72 L248,64 Z" fill="#FFFBEB"/>
    <circle cx="256" cy="72" r="3.5" fill="#78350F"/>
    
    <!-- Pivot Pin Rivet -->
    <circle cx="256" cy="410" r="11" fill="#0A0E1A" stroke="#FDE68A" stroke-width="4"/>
    <circle cx="256" cy="410" r="4" fill="#D97706"/>
  </g>
</svg>
